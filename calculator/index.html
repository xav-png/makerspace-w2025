<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator 🔢</title>
    <link rel="stylesheet" href="styles.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="calculate container">
        <div class="output-container container">
                <p class="output">Nothing here yet...</p>
        </div> 
        <div class="buttons container">
            <div class="one">
                <button>1</button>
            </div>
            <div class="two">
                <button>2</button>
            </div>
            <div class="three">
                <button>3</button>
            </div>
            <div class="four">
                <button>4</button>
            </div>
            <div class="five">
                <button>5</button>
            </div>
            <div class="six">
                <button>6</button>
            </div>
            <div class="seven">
                <button>7</button>
            </div>
            <div class="eight">
                <button>8</button>
            </div>
            <div class="nine">
                <button>9</button>
            </div>
            <div class="pi">
                <button>π</button>
            </div>
            <div class="square-root">
                <button>√</button>
            </div>
            <div class="modulo">
                <button>%</button>
            </div>
        </div>
    </div>

<script src="scripts.js"></script>
</body>
</html>
