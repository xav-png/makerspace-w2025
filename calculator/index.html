<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator 🔢</title>
    <link rel="stylesheet" href="styles.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>

    <nav>
        <li>
            <ul></ul>
        </li>
    </nav>

    <div class="calculate container-fluid">
        <div class="output-container container">
                <p class="output container"><span class="blank">Nothing here yet...</span></p>
        </div> 
        <div class="buttons container">
                <button class="one">1</button>
                <button class="two">2</button>
                <button class="three">3</button>
                <button class="four">4</button>
                <button class="five">5</button>
                <button class="six">6</button>
                <button class="seven">7</button>
                <button class="eight">8</button>
                <button class="nine">9</button>
                <button class="pi">π</button>
                <button class="modulo">%</button>
                <button class="add">+</button>
                <button class="subtract">-</button>
                <button class="multiply">&times;</button>
                <button class="divide">&divide;</button>
                <button class="equal">=</button>
            </div>
        </div>
    </div>

<script src="scripts.js"></script>
</body>
</html>
